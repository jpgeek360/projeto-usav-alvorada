{% extends "base.html" %}

{% block title %}Alterar Vacina - AUAUVORADA{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm rounded-4 bg-white">
      <div class="card-header bg-verde-claro-suave border-bottom py-3 px-4">
        <h1 class="h4 fw-bold text-verde-escuro mb-0">Alterar Vacina</h1>
      </div>
      <div class="card-body p-4 bg-white">
        <form method="POST" action="{{ url_for('pets.editar_vacina') }}" class="row g-3">
          <input type="hidden" name="nome_antigo" value="{{ nome_atual }}">

          <div class="col-12">
            <label for="nomeNovoVacina" class="form-label fw-semibold text-verde-escuro">
              Nome * <small class="text-muted fw-normal">(máx. 60)</small>
            </label>
            <input
              type="text"
              id="nomeNovoVacina"
              name="nome_novo"
              maxlength="60"
              class="form-control"
              required
              value="{{ nome_atual }}"
            >
          </div>

          <div class="col-12 pt-2 d-flex justify-content-end gap-2">
            <a href="{{ url_for('pets.vacinas') }}" class="btn btn-verde-claro">Cancelar</a>
            <button type="submit" class="btn btn-verde-escuro px-4">Salvar Alteração</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
