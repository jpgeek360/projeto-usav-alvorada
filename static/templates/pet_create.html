{% extends "base.html" %}

{% block title %}Cadastrar Animal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-header bg-verde-claro-suave border-bottom py-3 px-4">
        <h1 class="h4 fw-bold text-verde-escuro mb-0">Cadastrar Novo Animal para Adoção</h1>
      </div>
      <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data" class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Nome *</label>
            <input type="text" name="nome" class="form-control" required placeholder="Ex.: Paçoca">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Espécie *</label>
            <input type="text" name="especie" class="form-control" required placeholder="Ex.: Cão, Gato">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold text-verde-escuro">Gênero *</label>
            <select name="genero" class="form-select" required>
              {% for g in generos %}
                <option value="{{ g }}">{{ g }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold text-verde-escuro">Porte *</label>
            <select name="porte" class="form-select" required>
              {% for p in portes %}
                <option value="{{ p }}">{{ p }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold text-verde-escuro">Idade *</label>
            <input type="text" name="idade" class="form-control" required placeholder="Ex.: 2 anos">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Peso *</label>
            <input type="text" name="peso" class="form-control" required placeholder="Ex.: 12 kg">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Tempo no abrigo *</label>
            <input type="text" name="tempo_abrigo" class="form-control" required placeholder="Ex.: 4 meses">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold text-verde-escuro">Vacinas (separadas por vírgula)</label>
            <input type="text" name="vacinas" class="form-control" placeholder="Ex.: V10, Antirrábica, Giárdia">
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold text-verde-escuro">História *</label>
            <textarea name="historia" rows="4" class="form-control" required placeholder="Conte o temperamento, histórico de resgate e convivência..."></textarea>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Foto Principal (Capa) *</label>
            <input type="file" name="foto_principal" accept="image/*" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold text-verde-escuro">Galeria de Fotos (Opcional)</label>
            <input type="file" name="galeria" accept="image/*" class="form-control" multiple>
          </div>

          <div class="col-12 pt-3 d-flex justify-content-end gap-2">
            <a href="{{ url_for('main.index') }}" class="btn btn-verde-claro">Cancelar</a>
            <button type="submit" class="btn btn-verde-escuro px-4">Salvar Cadastro</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
