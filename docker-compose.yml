services:
  web:
    build:
      context: /home/joao/projeto-usav
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: projeto-usav-web
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-altere-esta-chave-no-arquivo-env}
    volumes:
      - /home/joao/projeto-usav/data:/app/data
      - /home/joao/projeto-usav/static/uploads:/app/static/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s